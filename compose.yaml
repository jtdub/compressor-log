x-backend: &backend
  build: ./backend
  image: compressor-log-backend
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    CELERY_BROKER_URL: redis://redis:6379/0
  volumes:
    - ./backend:/app

services:
  db:
    image: postgres:17
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  migrate:
    <<: *backend
    command: python manage.py migrate
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  worker:
    <<: *backend
    command: celery -A config worker -l info
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build: ./web
    image: compressor-log-web
    env_file: .env
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 90s
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules

volumes:
  db-data:
  web-node-modules:
