[project]
name = "compressor-log-backend"
version = "0.1.0"
description = "Backend API of compressor-log."
requires-python = ">=3.13,<3.14"
dependencies = [
    "celery[redis]>=5.7.0",
    "Django>=5.2,<5.3",
    "djangorestframework",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
    "mypy",
    "django-stubs",
    "djangorestframework-stubs",
    "celery-types>=0.26.0",
]

[tool.ruff]
line-length = 88
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"config/settings.py" = ["E501"]

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
