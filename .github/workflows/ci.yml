name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: compressor_log
      POSTGRES_USER: compressor_log
      POSTGRES_PASSWORD: compressor_log
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: compressor_log
          POSTGRES_USER: compressor_log
          POSTGRES_PASSWORD: compressor_log
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U compressor_log"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest
      - run: uv run python manage.py spectacular --file ../openapi/schema.yaml --validate --fail-on-warn
      - run: git diff --exit-code -- ":/openapi/"

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uvx towncrier==26.9.0 check --compare-with origin/${{ github.base_ref }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm generate:api
      - run: git diff --exit-code -- ":/web/src/api/"

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose version
      - run: docker compose up --build --wait
      - run: curl -f http://localhost:8000/api/v1/health/
      - run: curl -f http://localhost:5173/
      - run: curl -f http://localhost:5173/api/v1/health/
      - run: docker compose exec -T worker celery -A config inspect registered | grep core.ping
      - run: |
          docker compose stop db
          test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 http://localhost:8000/api/v1/health/)" = "503"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
